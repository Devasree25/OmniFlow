version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: omniflow-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: omniflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Rust Backend (optional - can be run locally)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omniflow-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/omniflow
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      HOST: 0.0.0.0
      PORT: 3000
      RUST_LOG: info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Angular Frontend (optional - can be run locally)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omniflow-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
