<div class="login-container">
  <div class="login-card">
    <div class="logo-section">
      <h1>OmniFlow</h1>
      <p class="subtitle">Multi-Tenant Workflow Platform</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <h2>Sign In</h2>

      <div class="error-message" *ngIf="error">
        {{ error }}
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="form-control"
          [class.is-invalid]="f['email'].invalid && f['email'].touched"
          placeholder="Enter your email"
        />
        <div class="invalid-feedback" *ngIf="f['email'].invalid && f['email'].touched">
          <span *ngIf="f['email'].errors?.['required']">Email is required</span>
          <span *ngIf="f['email'].errors?.['email']">Please enter a valid email</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="form-control"
          [class.is-invalid]="f['password'].invalid && f['password'].touched"
          placeholder="Enter your password"
        />
        <div class="invalid-feedback" *ngIf="f['password'].invalid && f['password'].touched">
          Password is required
        </div>
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-block"
        [disabled]="loading || loginForm.invalid"
      >
        <span *ngIf="!loading">Sign In</span>
        <span *ngIf="loading" class="loading-spinner"></span>
      </button>
    </form>

    <div class="demo-credentials">
      <p><strong>Demo Credentials:</strong></p>
      <p><small>Acme Corp Admin: admin&#64;acme.com / password123</small></p>
      <p><small>TechCorp Admin: admin&#64;techcorp.com / password123</small></p>

    </div>
  </div>
</div>
